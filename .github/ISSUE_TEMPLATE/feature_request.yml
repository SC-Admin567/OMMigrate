name: Feature Request / Question
description: Suggest an idea or ask a question about OMMigrate
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion or question! Note that OMMigrate is not
        currently accepting pull requests (see CONTRIBUTING.md) -- this is
        the place to propose ideas or ask how something works, not to
        submit code directly.

  - type: dropdown
    id: type
    attributes:
      label: What kind of request is this?
      options:
        - Feature request
        - Question about how something works
        - Documentation improvement suggestion
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What would you like to see, or what would you like to know?
      placeholder: Describe your idea or question
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use case (for feature requests)
      description: What problem would this solve, or what workflow would it improve?
    validations:
      required: false

  - type: dropdown
    id: account-type
    attributes:
      label: Related account type (if applicable)
      options:
        - Not applicable
        - POP3 - standard mail server
        - POP3 - AT&T/Yahoo legacy domain
        - POP3 - AWS SES outbound
        - POP3 - Gmail
        - IMAP - already IMAP
        - Microsoft Exchange
    validations:
      required: false
